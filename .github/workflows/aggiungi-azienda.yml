name: Aggiungi azienda da Issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Estrai dati dall'issue
        id: estrai
        uses: peter-evans/issue-forms-parser@v1
        with:
          issue-number: ${{ github.event.issue.number }}

      - name: Aggiungi azienda al JSON
        run: |
          node .github/scripts/aggiungiAzienda.js '${{ steps.estrai.outputs.json }}'

      - name: Crea Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          title: "Nuova azienda: ${{ steps.estrai.outputs.nome }}"
          body: "Aggiunta automatica da Issue #${{ github.event.issue.number }}"
          commit-message: "Aggiunta nuova azienda"
          branch: "azienda-${{ github.event.issue.number }}"